/* ==========================================================================
   JERRY HAIR SALOON — HERITAGE LUXURY BARBERSHOP THEME
   Warm Ivory (#F3EFE6) • Dark Espresso (#24211E) • Antique Gold (#B08A55) • Warm Beige (#D9D0C2)
   Bespoke Traditional Gentlemen's Grooming • Est. 8 Years • 117 Neelum Block, Iqbal Town
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap');
@import url('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css');
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200');

:root {
  --color-ivory: #F3EFE6;
  --color-espresso: #24211E;
  --color-gold: #B08A55;
  --color-gold-hover: #967443;
  --color-gold-light: #FBF8F2;
  --color-beige: #D9D0C2;
  --color-beige-subtle: #E8E1D5;
  --color-card: #FFFFFF;
  --color-border: #E0D7C9;
  --color-border-subtle: #ECE5DA;
  --color-border-dark: #3A3530;
  --color-text-primary: #24211E;
  --color-text-muted: #68615A;
  --color-text-light: #F3EFE6;
  
  --font-serif: 'Bodoni Moda', Georgia, serif;
  --font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* Global Reset & Strict 0px Straight-Razor Sharpness */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  background-color: var(--color-ivory) !important;
  color: var(--color-text-primary) !important;
  font-family: var(--font-sans);
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* Enforce 0px radius everywhere for straight-razor sharpness */
.btn, .card, .modal-content, .form-control, .input-group-text, 
.badge, .alert, .dropdown-menu, .nav-pills .nav-link, .list-group-item,
img, .img-fluid, .rounded, .rounded-top, .rounded-bottom, .rounded-start, .rounded-end,
.rounded-circle, .rounded-pill, input, select, textarea, button {
  border-radius: 0px !important;
}

/* Typography Classes */
.font-serif {
  font-family: var(--font-serif);
}

.font-sans {
  font-family: var(--font-sans);
}

.display-title {
  font-family: var(--font-serif);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: var(--color-espresso);
}

.headline-serif {
  font-family: var(--font-serif);
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--color-espresso);
}

.label-caps {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  line-height: 1.4;
}

.body-muted {
  color: var(--color-text-muted);
  font-size: 14px;
  line-height: 1.6;
}

/* Custom Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--color-ivory);
}
::-webkit-scrollbar-thumb {
  background: var(--color-beige);
  border: 1px solid var(--color-border);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--color-gold);
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* Background Utility Classes */
.bg-ivory {
  background-color: var(--color-ivory) !important;
}
.bg-beige {
  background-color: var(--color-beige) !important;
}
.bg-beige-subtle {
  background-color: var(--color-beige-subtle) !important;
}
.bg-espresso {
  background-color: var(--color-espresso) !important;
  color: var(--color-ivory) !important;
}
.bg-card {
  background-color: var(--color-card) !important;
}
.bg-gold {
  background-color: var(--color-gold) !important;
  color: var(--color-espresso) !important;
}

/* Text Colors */
.text-espresso {
  color: var(--color-espresso) !important;
}
.text-gold {
  color: var(--color-gold) !important;
}
.text-muted-heritage {
  color: var(--color-text-muted) !important;
}
.text-ivory {
  color: var(--color-ivory) !important;
}

/* Border Utilities */
.border-heritage {
  border: 1px solid var(--color-border) !important;
}
.border-heritage-top {
  border-top: 1px solid var(--color-border) !important;
}
.border-heritage-bottom {
  border-bottom: 1px solid var(--color-border) !important;
}
.border-gold {
  border-color: var(--color-gold) !important;
}
.border-dark-section {
  border: 1px solid var(--color-border-dark) !important;
}

/* Heritage Buttons */
.btn-gold-primary {
  background-color: var(--color-gold) !important;
  color: var(--color-espresso) !important;
  border: 1px solid var(--color-gold) !important;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 12px 24px;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 2px 6px rgba(176, 138, 85, 0.25);
}
.btn-gold-primary:hover, .btn-gold-primary:focus {
  background-color: var(--color-gold-hover) !important;
  color: #FFFFFF !important;
  border-color: var(--color-gold-hover) !important;
}
.btn-gold-primary:active {
  transform: scale(0.98);
}

.btn-espresso-primary {
  background-color: var(--color-espresso) !important;
  color: var(--color-ivory) !important;
  border: 1px solid var(--color-espresso) !important;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 12px 24px;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-espresso-primary:hover, .btn-espresso-primary:focus {
  background-color: var(--color-gold) !important;
  color: var(--color-espresso) !important;
  border-color: var(--color-gold) !important;
}

.btn-heritage-outline {
  background-color: transparent !important;
  color: var(--color-espresso) !important;
  border: 1px solid var(--color-espresso) !important;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 12px 24px;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-heritage-outline:hover, .btn-heritage-outline:focus {
  background-color: var(--color-espresso) !important;
  color: var(--color-ivory) !important;
  border-color: var(--color-espresso) !important;
}

.btn-gold-outline {
  background-color: transparent !important;
  color: var(--color-gold) !important;
  border: 1px solid var(--color-gold) !important;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  padding: 12px 24px;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-gold-outline:hover, .btn-gold-outline:focus {
  background-color: var(--color-gold) !important;
  color: var(--color-espresso) !important;
}

.btn-heritage-sm {
  padding: 8px 16px !important;
  font-size: 11px !important;
}

/* Category Filter Chips */
.chip-btn {
  background-color: var(--color-card);
  color: var(--color-espresso);
  border: 1px solid var(--color-border);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 8px 18px;
  white-space: nowrap;
  transition: all 0.2s ease;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(36, 33, 30, 0.04);
}
.chip-btn:hover {
  color: var(--color-gold);
  border-color: var(--color-gold);
}
.chip-btn.active {
  background-color: var(--color-espresso);
  color: var(--color-ivory);
  border-color: var(--color-espresso);
  font-weight: 700;
}

/* Service Card */
.service-card {
  background-color: var(--color-card);
  border: 1px solid var(--color-border);
  padding: 24px;
  transition: all 0.25s ease;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 4px 12px rgba(36, 33, 30, 0.04);
}
.service-card:hover {
  border-color: var(--color-gold);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(176, 138, 85, 0.12);
}
.service-card.selected {
  border-color: var(--color-gold);
  background-color: var(--color-gold-light);
  box-shadow: inset 0 0 0 1px var(--color-gold);
}

/* Gallery Portfolio Card */
.gallery-card {
  background-color: var(--color-card);
  border: 1px solid var(--color-border);
  overflow: hidden;
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(36, 33, 30, 0.04);
}
.gallery-card:hover {
  border-color: var(--color-gold);
  transform: translateY(-3px);
  box-shadow: 0 10px 28px rgba(176, 138, 85, 0.14);
}
.gallery-card .img-wrapper {
  overflow: hidden;
  position: relative;
  background-color: var(--color-beige);
  aspect-ratio: 4/3;
}
.gallery-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.gallery-card:hover img {
  transform: scale(1.05);
}

/* Specialist / Barber Card */
.barber-card {
  background-color: var(--color-card);
  border: 1px solid var(--color-border);
  transition: all 0.25s ease;
  position: relative;
  box-shadow: 0 4px 12px rgba(36, 33, 30, 0.04);
}
.barber-card:hover {
  border-color: var(--color-gold);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(176, 138, 85, 0.12);
}
.barber-card.active {
  border-color: var(--color-gold);
  background-color: var(--color-gold-light);
}

/* Time Slot & Date Chips */
.slot-btn {
  background-color: var(--color-card);
  border: 1px solid var(--color-border);
  color: var(--color-espresso);
  padding: 12px 16px;
  font-family: var(--font-sans);
  text-align: left;
  transition: all 0.2s ease;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.slot-btn:hover:not(:disabled) {
  border-color: var(--color-gold);
  background-color: var(--color-gold-light);
}
.slot-btn.active {
  background-color: var(--color-espresso) !important;
  color: var(--color-ivory) !important;
  border-color: var(--color-espresso) !important;
}
.slot-btn.active * {
  color: var(--color-ivory) !important;
}
.slot-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  text-decoration: line-through;
  background-color: var(--color-beige-subtle);
}

.date-btn {
  min-width: 80px;
  background-color: var(--color-card);
  border: 1px solid var(--color-border);
  color: var(--color-espresso);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  cursor: pointer;
}
.date-btn:hover {
  border-color: var(--color-gold);
}
.date-btn.active {
  background-color: var(--color-espresso) !important;
  color: var(--color-ivory) !important;
  border-color: var(--color-espresso) !important;
}
.date-btn.active * {
  color: var(--color-ivory) !important;
}

/* Month Calendar Styles */
.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  margin-bottom: 6px;
}
.calendar-weekday-cell {
  font-size: 11px;
  font-weight: 700;
  color: var(--color-text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 6px 0;
}
.calendar-days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.calendar-day-btn {
  height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background-color: var(--color-card);
  border: 1px solid var(--color-border-subtle);
  color: var(--color-espresso);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: all 0.18s ease;
  padding: 2px;
}
.calendar-day-btn:hover:not(:disabled) {
  border-color: var(--color-gold);
  background-color: rgba(176, 138, 85, 0.08);
}
.calendar-day-btn.is-today {
  border-color: var(--color-gold);
  font-weight: 700;
}
.calendar-day-btn .today-dot {
  position: absolute;
  bottom: 4px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background-color: var(--color-gold);
}
.calendar-day-btn.is-selected {
  background-color: var(--color-espresso) !important;
  border-color: var(--color-espresso) !important;
  color: var(--color-ivory) !important;
  box-shadow: 0 4px 12px rgba(36, 33, 30, 0.2);
}
.calendar-day-btn.is-selected * {
  color: var(--color-ivory) !important;
}
.calendar-day-btn.is-selected .today-dot {
  background-color: var(--color-gold) !important;
}
.calendar-day-btn:disabled {
  opacity: 0.25;
  cursor: not-allowed;
  border-color: transparent;
  background-color: transparent;
  text-decoration: line-through;
}
@media (max-width: 576px) {
  .calendar-day-btn {
    height: 40px;
    font-size: 12.5px;
  }
  .calendar-days-grid {
    gap: 4px;
  }
}

/* Sticky Booking Drawer */
.sticky-cart-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1040;
  background-color: rgba(36, 33, 30, 0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--color-gold);
  padding: 16px 24px;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25);
  animation: slideUp 0.3s ease-out;
  color: var(--color-ivory);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

/* Form Inputs */
.heritage-input {
  background-color: #FFFFFF !important;
  border: 1px solid var(--color-border) !important;
  color: var(--color-espresso) !important;
  font-family: var(--font-sans);
  font-size: 14px;
  padding: 12px 16px;
  transition: border-color 0.2s ease;
}
.heritage-input:focus {
  background-color: #FFFFFF !important;
  border-color: var(--color-gold) !important;
  outline: none !important;
  box-shadow: 0 0 0 2px rgba(176, 138, 85, 0.15) !important;
}
.heritage-input::placeholder {
  color: #9E968D;
}

/* Modal Dialogs */
.modal-heritage .modal-content {
  background-color: var(--color-ivory);
  border: 1px solid var(--color-border);
  color: var(--color-espresso);
  box-shadow: 0 20px 50px rgba(36, 33, 30, 0.2);
}

/* Navigation Tabs */
.nav-tab-link {
  color: var(--color-espresso);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 18px;
  transition: all 0.2s ease;
  cursor: pointer;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  position: relative;
}
.nav-tab-link:hover {
  color: var(--color-gold);
}
.nav-tab-link.active {
  color: var(--color-gold);
}
.nav-tab-link.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 18px;
  right: 18px;
  height: 2px;
  background-color: var(--color-gold);
}

/* Mobile Bottom Navigation */
.mobile-bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1050;
  background-color: rgba(243, 239, 230, 0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--color-border);
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px;
}
.mobile-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--color-espresso);
  text-decoration: none;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 6px 12px;
  transition: color 0.2s ease;
  cursor: pointer;
  background: transparent;
  border: none;
}
.mobile-nav-item i {
  font-size: 18px;
  margin-bottom: 2px;
}
.mobile-nav-item.active {
  color: var(--color-gold);
}

/* Hero Section */
.hero-wrapper-heritage {
  position: relative;
  min-height: 540px;
  background-color: var(--color-beige);
  overflow: hidden;
}
.hero-texture-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 75% 50%, rgba(243, 239, 230, 0.4) 0%, rgba(217, 208, 194, 0.85) 100%);
  pointer-events: none;
}

/* Lightbox Modal Overlay */
.lightbox-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1090;
  background-color: rgba(36, 33, 30, 0.85);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

@media (max-width: 768px) {
  body {
    padding-bottom: 74px;
  }
  .display-title {
    font-size: 32px;
  }
}

/* ==========================================================================
   PREMIUM REACT ANIMATIONS & INTERACTIVE TRANSITIONS
   Framer Motion helpers, hardware-accelerated transforms, and card hovers
   ========================================================================== */

/* Enhanced Smooth Interactive Elevations & Hovers */
.service-card, .barber-card, .trust-card, .portfolio-card, .stat-counter-card {
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), 
              box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),
              border-color 0.3s ease !important;
  will-change: transform, box-shadow;
}

.service-card:hover, .trust-card:hover, .stat-counter-card:hover {
  transform: translateY(-5px) !important;
  box-shadow: 0 14px 28px rgba(36, 33, 30, 0.08) !important;
  border-color: var(--color-gold) !important;
}

.barber-card:hover {
  transform: translateY(-6px) !important;
  box-shadow: 0 16px 36px rgba(176, 138, 85, 0.16) !important;
  border-color: var(--color-gold) !important;
}

.portfolio-card:hover {
  transform: translateY(-5px) !important;
  box-shadow: 0 16px 32px rgba(36, 33, 30, 0.12) !important;
  border-color: var(--color-gold) !important;
}

/* Secondary & Icon Micro-Animations inside cards */
.service-card:hover .service-icon-box i,
.trust-card:hover i {
  transform: scale(1.15) rotate(4deg);

    // Animated Counter Component (Triggers only once on viewport entry)
    function AnimatedCounter({ value, duration = 1.8, prefix = '', suffix = '', decimals = 0 }) {
      const [count, setCount] = useState(0);
      const counterRef = useRef(null);
      const inView = useInView(counterRef, { once: true, margin: '-40px' });

      useEffect(() => {
        if (!inView) return;
        if (prefersReducedMotion()) {
          setCount(value);
          return;
        }

        let startTime = null;
        let frameId;
        const numericTarget = typeof value === 'number' ? value : parseFloat(value.toString().replace(/,/g, ''));

        const updateCounter = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / (duration * 1000), 1);
          // Exponential ease out
          const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          const current = numericTarget * ease;
          setCount(current);
          if (progress < 1) {
            frameId = requestAnimationFrame(updateCounter);
          }
        };

        frameId = requestAnimationFrame(updateCounter);
        return () => cancelAnimationFrame(frameId);
      }, [inView, value, duration]);

      const formatted = decimals > 0 
        ? count.toFixed(decimals) 
        : Math.floor(count).toLocaleString();

      return (
        <span ref={counterRef}>
          {prefix}{formatted}{suffix}
        </span>
      );
    }

    // Magnetic Button Component (Subtle magnetic movement on desktop, disabled on touch)
    function MagneticButton({ children, className = '', style = {}, onClick, disabled, strength = 0.18, ...props }) {
      const btnRef = useRef(null);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      
      const isTouch = useMemo(() => {
        return typeof window !== 'undefined' && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
      }, []);

      const handleMouseMove = (e) => {
        if (isTouch || prefersReducedMotion() || !btnRef.current) return;
        const rect = btnRef.current.getBoundingClientRect();
        const x = e.clientX - (rect.left + rect.width / 2);
        const y = e.clientY - (rect.top + rect.height / 2);
        setPos({ x: x * strength, y: y * strength });
      };

      const handleMouseLeave = () => {
        setPos({ x: 0, y: 0 });
      };

      return (
        <motion.button
          ref={btnRef}
          className={className}
          style={style}
          onClick={onClick}
          disabled={disabled}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          animate={{ x: pos.x, y: pos.y }}
          transition={{ type: 'spring', damping: 15, stiffness: 160, mass: 0.1 }}
          whileHover={{ scale: 1.025 }}
          whileTap={{ scale: 0.96 }}
          {...props}
        >
          {children}
        </motion.button>
      );
    }

    // Parallax Box Component (Subtle parallax on selected background elements)
    function ParallaxBox({ children, className = '', speed = 0.12, style = {} }) {
      const ref = useRef(null);
      const [offsetY, setOffsetY] = useState(0);

      useEffect(() => {
        if (prefersReducedMotion()) return;
        let ticking = false;
        const handleScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(() => {
              if (ref.current) {
                const rect = ref.current.getBoundingClientRect();
                const scrolled = window.innerHeight - rect.top;
                if (scrolled > 0 && rect.bottom > 0) {
                  setOffsetY((scrolled - window.innerHeight / 2) * speed);
                }
              }
              ticking = false;
            });
            ticking = true;
          }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, [speed]);

      return (
        <div 
          ref={ref} 
          className={className} 
          style={{ ...style, transform: `translate3d(0, ${offsetY}px, 0)`, willChange: 'transform' }}
        >
          {children}
        </div>
      );
    }

                {filtered.length} Photographs Documented

                      <div className="position-absolute top-0 start-0 m-3 px-2 py-1 bg-card border-heritage shadow-sm">

                          <span className="label-caps text-gold fw-bold">{item.price}</span>
                        </div>
                        <p className="body-muted mb-3" style={{ fontSize: '13px' }}>
                          {item.description}
                        </p>
                      </div>

                      <div className="pt-2 border-heritage-top d-flex justify-content-between align-items-center">
                        <span className="label-caps text-muted-heritage" style={{ fontSize: '10px' }}>
                          <i className="bi bi-person text-gold me-1"></i>{item.stylist}
                        </span>
                        <MagneticButton 
                          className="btn btn-heritage-outline btn-heritage-sm py-1 px-3"
                          onClick={(e) => {
                            e.stopPropagation();
                            onRequestCut(item);
                          }}
                        >
                          <span>{item.category === 'haircuts' ? 'Book Cut' : 'Reserve Chair'}</span>

    }

    function Booking({ selectedServices, onToggleService, selectedBarber, setSelectedBarber, onBookingConfirmed }) {
      const today = useMemo(() => {
        const t = new Date();
        t.setHours(0, 0, 0, 0);
        return t;
      }, []);

      const initialDateStr = useMemo(() => {
        const d = new Date();
        const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
        const monthName = d.toLocaleDateString('en-US', { month: 'short' });
        const datePad = String(d.getDate()).padStart(2, '0');
        return `Today (${datePad} ${monthName})`;
      }, []);

      const [currentStep, setCurrentStep] = useState(selectedServices.length > 0 ? 2 : 1);
      const [selectedDate, setSelectedDate] = useState(initialDateStr);
      const [selectedDateObj, setSelectedDateObj] = useState(new Date());
      const [calendarViewMode, setCalendarViewMode] = useState('calendar'); // 'calendar' or 'strip'
      const [viewYear, setViewYear] = useState(new Date().getFullYear());
      const [viewMonth, setViewMonth] = useState(new Date().getMonth());
      const [selectedTime, setSelectedTime] = useState('02:00 PM');
      const [clientName, setClientName] = useState('Hamza Malik');
      const [clientPhone, setClientPhone] = useState('+92 300 8472910');
      const [clientNotes, setClientNotes] = useState('Low skin taper with textured crop on top, hot eucalyptus towel finish.');
      const [paymentMethod, setPaymentMethod] = useState('cash_counter');
      const [formError, setFormError] = useState('');

      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      const handlePrevMonth = () => {
        const curYear = today.getFullYear();
        const curMonth = today.getMonth();
        if (viewYear === curYear && viewMonth <= curMonth) return;
        if (viewMonth === 0) {
          setViewYear(y => y - 1);
          setViewMonth(11);
        } else {
          setViewMonth(m => m - 1);
        }
      };

      const handleNextMonth = () => {
        if (viewMonth === 11) {
          setViewYear(y => y + 1);
          setViewMonth(0);
        } else {
          setViewMonth(m => m + 1);
        }
      };

      // Generate 14-day quick rolling dates
      const dynamicRollingDays = useMemo(() => {
        const days = [];
        const base = new Date();
        base.setHours(0, 0, 0, 0);
        for (let i = 0; i < 14; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
          const monthName = d.toLocaleDateString('en-US', { month: 'short' });
          const datePad = String(d.getDate()).padStart(2, '0');
          let label = dayName.toUpperCase();
          if (i === 0) label = 'TODAY';
          else if (i === 1) label = 'TMRW';
          else if (d.getDay() === 0 || d.getDay() === 6) label = 'WEEKEND';
          else if (d.getDay() === 5) label = 'PRIME';

          const id = i === 0 ? `Today (${datePad} ${monthName})` : 
                     i === 1 ? `Tomorrow (${datePad} ${monthName})` : 
                     `${dayName} (${datePad} ${monthName})`;
          days.push({
            id,
            label,
            date: `${datePad} ${monthName}`,
            day: dayName.toUpperCase(),
            dateObj: d
          });
        }
        return days;
      }, []);

      // Calendar matrix calculation
      const calendarDays = useMemo(() => {
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const firstDayIndex = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7; // Monday = 0
        const cells = [];
        
        // Blank padding cells for days before the 1st
        for (let i = 0; i < firstDayIndex; i++) {
          cells.push({ type: 'empty', key: `empty-${i}` });
        }

        const todayClean = new Date();
        todayClean.setHours(0, 0, 0, 0);

        for (let day = 1; day <= daysInMonth; day++) {
          const cellDate = new Date(viewYear, viewMonth, day);
          cellDate.setHours(0, 0, 0, 0);
          const isPast = cellDate < todayClean;
          const isToday = cellDate.getTime() === todayClean.getTime();
          const isSelected = selectedDateObj && cellDate.toDateString() === selectedDateObj.toDateString();

          cells.push({
            type: 'day',
            key: `day-${day}`,
            dayNum: day,
            dateObj: cellDate,
            isPast,
            isToday,
            isSelected
          });
        }

        return cells;
      }, [viewYear, viewMonth, selectedDateObj]);

      const handleSelectDay = (dayObj) => {
        if (dayObj.isPast) return;
        const d = dayObj.dateObj;
        const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
        const monthName = d.toLocaleDateString('en-US', { month: 'short' });
        const datePad = String(dayObj.dayNum).padStart(2, '0');

        const todayClean = new Date();
        todayClean.setHours(0, 0, 0, 0);
        const tmrwClean = new Date(todayClean);
        tmrwClean.setDate(todayClean.getDate() + 1);

        let id = `${dayName} (${datePad} ${monthName})`;
        if (d.getTime() === todayClean.getTime()) id = `Today (${datePad} ${monthName})`;
        else if (d.getTime() === tmrwClean.getTime()) id = `Tomorrow (${datePad} ${monthName})`;

        setSelectedDate(id);
        setSelectedDateObj(d);
      };

      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        const timer = setTimeout(() => {
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        }, 50);
        return () => clearTimeout(timer);
      }, []);

      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
      }, [currentStep]);

      const timeSlots = {
        morning: [
          { time: '10:00 AM', label: 'Opening Slot', available: true },
          { time: '11:30 AM', label: "Jerry's Chair", available: true }
        ],
        afternoon: [
          { time: '02:00 PM', label: 'Prime Slot', available: true },
          { time: '03:30 PM', label: 'Open Chair', available: true },
          { time: '05:00 PM', label: 'Open Chair', available: true }
        ],
        evening: [
          { time: '07:00 PM', label: 'Peak Hour', available: true },
          { time: '08:30 PM', label: 'Peak Hour', available: true },
          { time: '10:00 PM', label: 'Final Call', available: false }
        ]
      };

      const totalPrice = useMemo(() => {
        return selectedServices.reduce((sum, item) => sum + item.price, 0);
      }, [selectedServices]);

      const totalDuration = useMemo(() => {
        if (selectedServices.length === 0) return '30 Mins';
        let mins = 0;
        selectedServices.forEach(s => {
          mins += parseInt(s.duration) || 30;
        });
        return `${mins} Mins`;
      }, [selectedServices]);

      const handleConfirmReservation = (e) => {
        e.preventDefault();
        if (!clientName.trim() || !clientPhone.trim()) {
          setFormError('Please enter your full name and phone number.');
          return;
        }
        if (selectedServices.length === 0) {
          setFormError('Please select at least one grooming service.');
          setCurrentStep(1);
          return;
        }

        const details = {
          bookingId: `JH-${Math.floor(1000 + Math.random() * 9000)}`,
          services: selectedServices,
          totalPrice,
          totalDuration,
          barber: selectedBarber || barbersData[0],
          date: selectedDate,
          time: selectedTime,
          clientName,
          clientPhone,
          clientNotes,
          paymentMethod
        };
        onBookingConfirmed(details);
      };

      return (
        <div className="booking-view py-5 bg-ivory">
          <div className="container">
            <div className="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 pb-3 border-heritage-bottom">
              <div>
                <div className="d-flex align-items-center gap-2 mb-1">
                  <span className="label-caps text-gold fw-bold">Reservation Protocol</span>
                  <span className="badge bg-espresso text-ivory label-caps px-2 py-0.5">Instant Confirmation</span>
                </div>
                <h1 className="display-title text-espresso fs-2 mb-1">Reserve Your Chair</h1>
                <p className="body-muted mb-0">
                  Skip wait times during peak evening hours at 117 Neelum Block, Iqbal Town.
                </p>
              </div>
              <span className="label-caps text-muted-heritage mt-2 mt-md-0">
                Reservation Flow
              </span>
            </div>

            {/* Progress Tracker */}
            <div className="border-heritage p-3 bg-card mb-4 shadow-sm">
              <div className="row g-1 g-sm-2 text-center">
                <div className="col-3 booking-progress-step cursor-pointer" onClick={() => setCurrentStep(1)}>
                  <div className="w-100 mb-1" style={{ height: '3px', backgroundColor: currentStep >= 1 ? 'var(--color-gold)' : 'var(--color-border)' }}></div>
                  <span className="label-caps d-block" style={{ color: currentStep >= 1 ? 'var(--color-gold)' : 'var(--color-text-muted)' }}>Services</span>
                </div>
                <div className="col-3 booking-progress-step cursor-pointer" onClick={() => setCurrentStep(2)}>
                  <div className="w-100 mb-1" style={{ height: '3px', backgroundColor: currentStep >= 2 ? 'var(--color-gold)' : 'var(--color-border)' }}></div>
                  <span className="label-caps d-block" style={{ color: currentStep >= 2 ? 'var(--color-gold)' : 'var(--color-text-muted)' }}>Specialist</span>
                </div>
                <div className="col-3 booking-progress-step cursor-pointer" onClick={() => setCurrentStep(3)}>
                  <div className="w-100 mb-1" style={{ height: '3px', backgroundColor: currentStep >= 3 ? 'var(--color-gold)' : 'var(--color-border)' }}></div>
                  <span className="label-caps d-block" style={{ color: currentStep >= 3 ? 'var(--color-gold)' : 'var(--color-text-muted)' }}>Schedule</span>
                </div>
                <div className="col-3 booking-progress-step cursor-pointer" onClick={() => setCurrentStep(4)}>
                  <div className="w-100 mb-1" style={{ height: '3px', backgroundColor: currentStep >= 4 ? 'var(--color-gold)' : 'var(--color-border)' }}></div>
                  <span className="label-caps d-block" style={{ color: currentStep >= 4 ? 'var(--color-gold)' : 'var(--color-text-muted)' }}>Ledger</span>
                </div>
              </div>
            </div>

            {formError && (
              <div className="alert border-heritage bg-card text-espresso mb-4 d-flex align-items-center gap-2 shadow-sm">
                <i className="bi bi-exclamation-triangle-fill text-gold fs-5"></i>
                <span className="label-caps text-espresso">{formError}</span>
              </div>
            )}

            <div className="row g-4">
              <div className="col-12 col-lg-8">
                <AnimatePresence mode="wait">
                  <motion.div
                    key={currentStep}
                    initial={{ opacity: 0, x: 14 }}
                    animate={{ opacity: 1, x: 0 }}
                    exit={{ opacity: 0, x: -14 }}
                    transition={{ duration: 0.28, ease: easeLuxury }}
                  >
                {currentStep === 1 && (
                  <div className="border-heritage p-4 bg-card shadow-sm">
                    <h3 className="headline-serif text-espresso fs-4 mb-3">Select Grooming Services</h3>
                    <div className="row g-3 mb-4">
                      {servicesData.map((service) => {
                        const isSelected = selectedServices.some(s => s.id === service.id);
                        return (
                          <div key={service.id} className="col-12 col-md-6">
                            <div 
                              className={`border-heritage p-3 h-100 d-flex flex-column justify-content-between ${isSelected ? 'bg-gold-light' : 'bg-card'}`}
                              style={{ borderColor: isSelected ? 'var(--color-gold)' : 'var(--color-border)', cursor: 'pointer' }}
                              onClick={() => onToggleService(service)}
                            >
                              <div>
                                <div className="d-flex justify-content-between align-items-start mb-1">
                                  <h5 className="headline-serif text-espresso fs-6 mb-0">{service.name}</h5>
                                  <i className={`bi ${isSelected ? 'bi-check-square-fill text-gold' : 'bi-square text-muted-heritage'}`}></i>
                                </div>
                                <p className="body-muted mb-2" style={{ fontSize: '12px' }}>
                                  {service.description.substring(0, 75)}...
                                </p>
                              </div>
                              <div className="d-flex justify-content-between align-items-center pt-2 border-heritage-top">
                                <span className="label-caps text-muted-heritage" style={{ fontSize: '10px' }}>{service.duration}</span>
                                <span className="headline-serif text-espresso fw-bold">PKR {service.price.toLocaleString()}</span>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div className="d-flex justify-content-end">
                      <button 
                        className="btn btn-gold-primary"
                        disabled={selectedServices.length === 0}
                        onClick={() => {
                          if (selectedServices.length === 0) { setFormError('Select at least 1 service'); return; }
                          setFormError('');
                          setCurrentStep(2);
                        }}
                      >
                        <span>Proceed to Specialist</span>
                        <i className="bi bi-arrow-right"></i>
                      </button>
                    </div>
                  </div>
                )}

                {currentStep === 2 && (
                  <div className="border-heritage p-4 bg-card shadow-sm">
                    <h3 className="headline-serif text-espresso fs-4 mb-3">Select Specialist Barber</h3>
                    <div className="row g-3 mb-4">
                      {barbersData.map((barber) => {
                        const isSelected = selectedBarber?.id === barber.id;
                        return (
                          <div key={barber.id} className="col-12">
                            <div 
                              className={`border-heritage p-3 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 ${isSelected ? 'bg-gold-light' : 'bg-card'}`}
                              style={{ borderColor: isSelected ? 'var(--color-gold)' : 'var(--color-border)', cursor: 'pointer' }}
                              onClick={() => setSelectedBarber(barber)}
                            >
                              <div className="d-flex gap-3 align-items-center">
                                <img 
                                  src={barber.avatar} 
                                  alt={barber.name} 
                                  className="border-heritage shadow-sm"
                                  style={{ width: '70px', height: '70px', objectFit: 'cover' }}
                                  onError={(e) => { e.target.src = barber.fallbackAvatar; }}
                                />
                                <div>
                                  <div className="d-flex align-items-center gap-2">
                                    <h4 className="headline-serif text-espresso fs-5 mb-0">{barber.name}</h4>
                                    {isSelected && <span className="badge bg-gold text-espresso label-caps px-2 py-0.5 fw-bold">Selected</span>}
                                  </div>
                                  <span className="label-caps text-gold fw-bold d-block">{barber.role}</span>
                                  <span className="body-muted" style={{ fontSize: '12px' }}>{barber.experience} • Rating: ★ {barber.rating}</span>
                                </div>
                              </div>
                              <div className="text-sm-end">
                                <span className="label-caps text-muted-heritage d-block mb-1">{barber.chair}</span>
                                <span className={`btn ${isSelected ? 'btn-gold-primary' : 'btn-heritage-outline'} btn-heritage-sm py-1 px-3`}>
                                  {isSelected ? 'Active Selection' : 'Select'}
                                </span>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div className="d-flex justify-content-between">
                      <button className="btn btn-heritage-outline" onClick={() => setCurrentStep(1)}>
                        <i className="bi bi-arrow-left"></i><span>Back</span>
                      </button>
                      <button className="btn btn-gold-primary" onClick={() => setCurrentStep(3)}>
                        <span>Proceed to Schedule</span><i className="bi bi-arrow-right"></i>
                      </button>
                    </div>
                  </div>
                )}

                {currentStep === 3 && (
                  <div className="border-heritage p-4 bg-card shadow-sm">
                    <h3 className="headline-serif text-espresso fs-4 mb-3">Select Date &amp; Arrival Slot</h3>
                    
                    {/* Date Selection Header & Mode Switcher */}
                    <div className="mb-4">
                      <div className="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
                        <label className="label-caps text-espresso fw-bold mb-0">Select Date According to Month:</label>
                        <div className="d-inline-flex border-heritage bg-card p-1 shadow-sm">
                          <button 
                            type="button"
                            className={`btn btn-sm ${calendarViewMode === 'calendar' ? 'btn-gold-primary' : 'btn-heritage-outline border-0'} py-1 px-3`}
                            style={{ fontSize: '11px' }}
                            onClick={() => setCalendarViewMode('calendar')}
                          >
                            <i className="bi bi-calendar3 me-1"></i> Month Calendar
                          </button>
                          <button 
                            type="button"
                            className={`btn btn-sm ${calendarViewMode === 'strip' ? 'btn-gold-primary' : 'btn-heritage-outline border-0'} py-1 px-3`}
                            style={{ fontSize: '11px' }}
                            onClick={() => setCalendarViewMode('strip')}
                          >
                            <i className="bi bi-view-list me-1"></i> Quick 14 Days
                          </button>
                        </div>
                      </div>

                      {calendarViewMode === 'calendar' ? (
                        /* Full Month Interactive Calendar */
                        <div className="border-heritage p-3 p-md-4 bg-card shadow-sm mb-3">
                          {/* Month & Year Navigation Header */}
                          <div className="d-flex justify-content-between align-items-center mb-3 pb-2 border-heritage-bottom">
                            <div className="d-flex align-items-center gap-2">
                              <i className="bi bi-calendar-event text-gold fs-5"></i>
                              <h4 className="headline-serif text-espresso fs-5 fw-bold mb-0">
                                {monthNames[viewMonth]} {viewYear}
                              </h4>
                              {viewMonth === today.getMonth() && viewYear === today.getFullYear() && (
                                <span className="badge bg-gold text-espresso label-caps px-2 py-0.5" style={{ fontSize: '9px' }}>Current Month</span>
                              )}
                            </div>
                            <div className="d-flex align-items-center gap-1">
                              <button
                                type="button"
                                className="btn btn-heritage-outline btn-heritage-sm py-1 px-2"
                                disabled={viewYear === today.getFullYear() && viewMonth <= today.getMonth()}
                                onClick={handlePrevMonth}
                                title="Previous Month"
                              >
                                <i className="bi bi-chevron-left"></i>
                              </button>
                              <button
                                type="button"
                                className="btn btn-heritage-outline btn-heritage-sm py-1 px-2"
                                onClick={() => {
                                  setViewYear(today.getFullYear());
                                  setViewMonth(today.getMonth());
                                }}
                                title="Go to Today's Month"
                                style={{ fontSize: '10px' }}
                              >
                                Today
                              </button>
                              <button
                                type="button"
                                className="btn btn-heritage-outline btn-heritage-sm py-1 px-2"
                                onClick={handleNextMonth}
                                title="Next Month"
                              >
                                <i className="bi bi-chevron-right"></i>
                              </button>
                            </div>
                          </div>

                          {/* Day of Week Labels */}
                          <div className="calendar-weekdays mb-2">
                            {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(wd => (
                              <div key={wd} className="calendar-weekday-cell">
                                {wd}
                              </div>
                            ))}
                          </div>

                          {/* Calendar Days Grid */}
                          <div className="calendar-days-grid">
                            {calendarDays.map((cell) => {
                              if (cell.type === 'empty') {
                                return <div key={cell.key} className="p-1"></div>;
                              }
                              return (
                                <button
                                  key={cell.key}
                                  type="button"
                                  className={`calendar-day-btn ${cell.isToday ? 'is-today' : ''} ${cell.isSelected ? 'is-selected' : ''}`}
                                  disabled={cell.isPast}
                                  onClick={() => handleSelectDay(cell)}
                                  title={cell.isToday ? 'Today' : cell.dateObj.toDateString()}
                                >
                                  <span className="day-number">{cell.dayNum}</span>
                                  {cell.isToday && !cell.isSelected && (
                                    <span className="today-dot"></span>
                                  )}
                                </button>
                              );

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [selectedServices, setSelectedServices] = useState([]);
      const [selectedBarber, setSelectedBarber] = useState(barbersData[0]);
      const [lightboxItem, setLightboxItem] = useState(null);
      const [isVipModalOpen, setIsVipModalOpen] = useState(false);
      const [isQuickBookOpen, setIsQuickBookOpen] = useState(false);
      const [confirmedBooking, setConfirmedBooking] = useState(null);

      // Always reset window scroll when switching tabs
      useEffect(() => {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        const timer = setTimeout(() => {
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        }, 50);
        return () => clearTimeout(timer);
      }, [currentTab]);

      const handleToggleService = (service) => {
        if (service === 'clear_all') {
          setSelectedServices([]);
          return;
        }
        setSelectedServices((prev) => {
          const exists = prev.some(item => item.id === service.id);
          return exists ? prev.filter(item => item.id !== service.id) : [...prev, service];
        });
      };

      const handleSelectService = (service) => {
        setSelectedServices((prev) => {
          const exists = prev.some(item => item.id === service.id);
          return exists ? prev : [...prev, service];
        });
      };

      const handleRequestCut = (galleryItem) => {
        const matched = servicesData.find(s => s.name.toLowerCase().includes('fade')) || servicesData[0];
        handleSelectService(matched);
        if (galleryItem.stylist.includes('Jerry')) setSelectedBarber(barbersData[0]);
        else if (galleryItem.stylist.includes('Hunain') || galleryItem.stylist.includes('Tariq')) setSelectedBarber(barbersData[1]);
        else if (galleryItem.stylist.includes('Adnan')) setSelectedBarber(barbersData[2]);
        setCurrentTab('booking');
      };

      const handleQuickBookConfirm = (data) => {
        setIsQuickBookOpen(false);
        const details = {
          bookingId: `JH-${Math.floor(1000 + Math.random() * 9000)}`,
          services: selectedServices.length > 0 ? selectedServices : [servicesData[0]],
          totalPrice: selectedServices.length > 0 ? selectedServices.reduce((a, b) => a + b.price, 0) : servicesData[0].price,
          totalDuration: '45 Mins',
          barber: barbersData.find(b => b.name === data.barber) || barbersData[0],
          date: `${data.day} (Fast Slot)`,
          time: data.slot,
          clientName: 'Guest Client',
          clientPhone: '+92 300 0000000',
          clientNotes: 'Fast Chair Reservation',
          paymentMethod: 'Cash at Counter'
        };
        setConfirmedBooking(details);
      };

      return (
        <div className="saloon-app min-vh-100 d-flex flex-column bg-ivory text-espresso">
          <Header 
            currentTab={currentTab}
            setCurrentTab={setCurrentTab}
            onOpenQuickBook={() => setIsQuickBookOpen(true)}
            onOpenVipModal={() => setIsVipModalOpen(true)}
          />

          <main className="flex-grow-1 position-relative overflow-hidden">
            <AnimatePresence mode="wait">
              <motion.div
                key={currentTab}
                initial={{ opacity: 0, y: 14 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0, y: -14 }}
                transition={{ duration: 0.32, ease: easeLuxury }}
              >
                {currentTab === 'home' && (
                  <Home 
                    setCurrentTab={setCurrentTab}
                    onSelectService={handleSelectService}
                    onSelectBarber={(b) => setSelectedBarber(b)}
                    onOpenVipModal={() => setIsVipModalOpen(true)}
                  />
                )}

                {currentTab === 'services' && (
                  <Services 
                    selectedServices={selectedServices}
                    onToggleService={handleToggleService}
                    onProceedToBooking={() => setCurrentTab('booking')}
                  />
                )}

                {currentTab === 'gallery' && (
                  <Gallery 
                    onSelectImage={(item) => setLightboxItem(item)}
                    onRequestCut={handleRequestCut}
                  />
                )}

                {currentTab === 'booking' && (
                  <Booking 
                    selectedServices={selectedServices}
                    onToggleService={handleToggleService}
                    selectedBarber={selectedBarber}
                    setSelectedBarber={setSelectedBarber}
                    onBookingConfirmed={(d) => setConfirmedBooking(d)}
                  />
                )}
              </motion.div>
            </AnimatePresence>
          </main>

          <Footer 
            setCurrentTab={setCurrentTab}
            onOpenVipModal={() => setIsVipModalOpen(true)}
          />

          <BottomNav 
            currentTab={currentTab}
            setCurrentTab={setCurrentTab}
          />

          <LightboxModal 
            item={lightboxItem}
            onClose={() => setLightboxItem(null)}
            onRequestCut={handleRequestCut}
          />

          <VipModal 
            isOpen={isVipModalOpen}
            onClose={() => setIsVipModalOpen(false)}
          />

          <QuickBookModal 
            isOpen={isQuickBookOpen}
            onClose={() => setIsQuickBookOpen(false)}
            onQuickBookConfirm={handleQuickBookConfirm}
          />

          <BookingConfirmationModal 
            bookingDetails={confirmedBooking}
            onClose={() => {
              setConfirmedBooking(null);
              setCurrentTab('home');
            }}
          />
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
